  <text x="245" y="142" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="20" font-weight="bold">!</text>

  <!-- Digital Footprint Data Trail -->
  <g transform="translate(380, 100)">
    <rect width="340" height="48" rx="10" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="20" y="30" fill="#cffafe" font-family="Arial" font-size="14" font-weight="bold">Live Flight / Boarding Pass: AVOID</text>
