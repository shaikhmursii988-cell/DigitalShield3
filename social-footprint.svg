  </defs>
  <rect width="800" height="360" rx="24" fill="url(#g4)"/>
  <!-- Map Pin / Geo location warning -->
  <circle cx="200" cy="180" r="80" fill="#0e7490" opacity="0.2"/>
  <path d="M200 110 C165 110 140 135 140 170 C140 215 200 270 200 270 C200 270 260 215 260 170 C260 135 235 110 200 110 Z" fill="#06b6d4"/>
  <circle cx="200" cy="165" r="22" fill="#ffffff"/>
  <circle cx="200" cy="165" r="10" fill="#0891b2"/>
  <!-- Warning badge on location -->
