    <rect y="65" width="340" height="48" rx="10" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="20" y="95" fill="#cffafe" font-family="Arial" font-size="14" font-weight="bold">Home Address / Daily Routine: AVOID</text>
    <text x="300" y="95" fill="#ef4444" font-family="Arial" font-size="16" font-weight="bold">✕</text>

    <rect y="130" width="340" height="48" rx="10" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="20" y="160" fill="#cffafe" font-family="Arial" font-size="14" font-weight="bold">Phone Number &amp; Private Email: HIDE</text>
    <text x="300" y="160" fill="#10b981" font-family="Arial" font-size="16" font-weight="bold">✓</text>
  </g>

  <text x="60" y="55" fill="#67e8f9" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="1">DIGITAL FOOTPRINT &amp; OVERSHARING RISKS</text>
