<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360">
  <defs>
    <linearGradient id="gAI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180b2b"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" rx="24" fill="url(#gAI)"/>
  <!-- AI Split Face / Synthetic Media Graphic -->
  <circle cx="200" cy="180" r="75" fill="#3b0764" opacity="0.6"/>
  <!-- Left human half -->
  <path d="M200 110 A70 70 0 0 0 200 250 Z" fill="#c084fc"/>
  <!-- Right robot/cyber half -->
  <path d="M200 110 A70 70 0 0 1 200 250 Z" fill="#06b6d4"/>
  <!-- Split circuit lines -->
  <line x1="200" y1="90" x2="200" y2="270" stroke="#f43f5e" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="165" cy="170" r="8" fill="#ffffff"/>
  <circle cx="235" cy="170" r="8" fill="#22d3ee"/>
  <circle cx="235" cy="170" r="4" fill="#ffffff"/>
  <!-- Audio wave fake voice indicator -->
  <g transform="translate(420, 100)">
    <rect width="300" height="55" rx="12" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <text x="20" y="34" fill="#e9d5ff" font-family="Arial" font-size="14" font-weight="bold">🎙️ Voice Clone Detection</text>
    <text x="240" y="34" fill="#f43f5e" font-family="Arial" font-size="14" font-weight="bold">ALERT</text>
  </g>
  <g transform="translate(420, 175)">
    <rect width="300" height="55" rx="12" fill="#1e1b4b" stroke="#06b6d4" stroke-width="2"/>
    <text x="20" y="34" fill="#cffafe" font-family="Arial" font-size="14" font-weight="bold">🎭 Video Face-Swap Filter</text>
    <text x="240" y="34" fill="#fbbf24" font-family="Arial" font-size="14" font-weight="bold">FAKE</text>
  </g>

  <text x="60" y="55" fill="#d8b4fe" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="1">AI &amp; DEEPFAKE SYNTHETIC MEDIA AWARENESS</text>
</svg>
